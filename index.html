<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ცხრილი</title>
  </head>
  <body>
    <table>
      <thead>
        <th colspan="3">მენიუ</th>
      </thead>
      <tbody>
        <tr>
          <th>კატეგორია</th>
          <th>პროდუქტი</th>
          <th>ფასი</th>
        </tr>
        <tr>
          <td rowspan="2">სასმელი</td>
          <td>ყავა</td>
          <td>7 ლარი</td>
        </tr>
        <tr>
          <td>ჩაი</td>
          <td>5 ლარი</td>
        </tr>
        <tr>
          <td rowspan="2">საჭმელი</td>
          <td>სენდვიჩი</td>
          <td>10 ლარი</td>
        </tr>
        <tr>
          <td>ჰოთ-დოგი</td>
          <td>12 ლარი</td>
        </tr>
        <tr>
          <td>დესერტი</td>
          <td>კრუასანი</td>
          <td>8 ლარი</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
